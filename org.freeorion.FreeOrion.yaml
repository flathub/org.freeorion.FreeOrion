app-id: org.freeorion.FreeOrion
command: freeorion
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk

finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=pulseaudio

cleanup:
  - /include
  - /lib/cmake

modules:
  - shared-modules/glew/glew.json
  - shared-modules/glu/glu-9.json

  - name: boost
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh --prefix=${FLATPAK_DEST} --with-python=/usr/bin/python3 --with-libraries=filesystem,iostreams,locale,log,serialization,system,thread,python,regex
      - ./b2 --reconfigure -j ${FLATPAK_BUILDER_N_JOBS} toolset=gcc threading=multi
        variant=release debug-symbols=off link=shared runtime-link=shared cflags="-I/usr/include/python3.7m
        -fPIC -O3" cxxflags="-I/usr/include/python3.7m -fPIC -O3" install
    sources:
      - type: archive
        url: https://archives.boost.io/release/1.90.0/source/boost_1_90_0.tar.bz2
        sha256: 49551aff3b22cbc5c5a9ed3dbc92f0e23ea50a0f7325b0d198b705e8ee3fc305
        x-checker-data:
          type: anitya
          project-id: 6845
          stable-only: true
          url-template: https://archives.boost.io/release/$version/source/boost_${major}_${minor}_$patch.tar.bz2

  - name: freeorion
    buildsystem: cmake-ninja
    builddir: true
    sources:
      - type: archive
        url: https://github.com/freeorion/freeorion/archive/v0.5.1.2.tar.gz
        sha256: c2f90534bdf6b8281a78d01be9d7ccf5ae4f401f9f4fe4b3693de3443977c0d7
        x-checker-data:
          type: anitya
          project-id: 12152
          stable-only: true
          url-template: https://github.com/freeorion/freeorion/archive/v$version.tar.gz
      - type: patch
        path: fix-screenshot.patch
